name: Build YASER GAME APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: dulvui/godot-android-export@v4
        with:
          godot-version: 4.4.1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YASER-GAME-APK
          path: ./**/*.apk
