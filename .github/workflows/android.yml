name: YASER GAME Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        uses: myood/godot-ci-android-export:latest
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/YASER-GAME.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YASER-GAME-APK
          path: build/YASER-GAME.apk
